<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simon — Симон говорит</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <header class="game__header">
      <h1 class="game__title">Simon</h1>
      <p class="game__subtitle">Симон говорит: <a href="./simon-pro/index.html">"Попробуй Simon Pro!"</a></p>
    </header>

    <div class="hud">
      <div class="hud__item">
        <span class="hud__label">Уровень</span>
        <span class="hud__value" id="level">0</span>
      </div>
      <div class="hud__item">
        <span class="hud__label">Статус</span>
        <span class="hud__value hud__value--status" id="status">Готовы?</span>
      </div>
    </div>

    <div class="board" id="board" aria-label="Игровое поле Simon">
      <button class="pad pad--green"  data-index="0" type="button" aria-label="Зелёный сектор"></button>
      <button class="pad pad--red"    data-index="1" type="button" aria-label="Красный сектор"></button>
      <button class="pad pad--yellow" data-index="2" type="button" aria-label="Жёлтый сектор"></button>
      <button class="pad pad--blue"   data-index="3" type="button" aria-label="Синий сектор"></button>
      <div class="board__center" aria-hidden="true">
        <span class="board__center-text">Simon</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn--start" id="startBtn" type="button">Старт</button>

      <p class="hint">
        <span class="keygrid" aria-label="Раскладка управления">
          <kbd>Q</kbd><kbd>W</kbd>
          <kbd>A</kbd><kbd>S</kbd>
        </span>
        — секторы,&nbsp; <kbd>Enter</kbd> — старт.
      </p>
    </div>

    <p class="message" id="message" role="status" aria-live="polite"></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
